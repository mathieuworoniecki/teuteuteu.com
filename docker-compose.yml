services:
  web:
    build:
      context: .
      target: development
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
